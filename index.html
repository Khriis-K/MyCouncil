<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://aistudiocdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:3000 ws://localhost:3001; img-src 'self' data: https://avataaars.io;">
    <title>MyCouncil</title>
    <link rel="icon" type="image/x-icon" href="/imgs/favi.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      // Every colour reads a theme token from index.css. color-mix keeps opacity modifiers (bg-seal/10) working.
      const token = name => `color-mix(in srgb, var(--${name}) calc(<alpha-value> * 100%), transparent)`;
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['var(--font-display)'],
              body: ['var(--font-body)'],
              label: ['var(--font-label)'],
            },
            colors: {
              paper: token('paper'),
              paper2: token('paper2'),
              ink: token('ink'),
              ink2: token('ink2'),
              rule: token('rule'),
              seal: token('seal'),
              brass: token('brass'),
              'on-seal': token('on-seal'),
              veil: 'var(--veil)', // already translucent, so no opacity modifier
              analyst: token('group-analyst'),
              diplomat: token('group-diplomat'),
              sentinel: token('group-sentinel'),
              explorer: token('group-explorer'),
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'fade-out-in': 'fadeOutIn 0.6s ease-in-out',
              'slide-in-right': 'slideInRight 0.4s ease-out',
              'slide-in-left': 'slideInLeft 0.4s ease-out',
              'slide-out-right': 'slideOutRight 0.4s ease-out forwards',
              'slide-in-from-right': 'slideInFromRight 0.3s ease-out',
              'slide-out-left': 'slideOutLeft 0.3s ease-out forwards',
              'slide-down': 'slideDown 0.4s ease-out',
              'slide-from-center': 'slideFromCenter 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeOutIn: {
                '0%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              slideInLeft: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              slideOutRight: {
                '0%': { transform: 'translateX(0)', opacity: '1' },
                '100%': { transform: 'translateX(100%)', opacity: '0' },
              },
              slideInFromRight: {
                '0%': { transform: 'translate(100%, 0)', opacity: '0' },
                '100%': { transform: 'translate(-50%, 0)', opacity: '1' },
              },
              slideOutLeft: {
                '0%': { transform: 'translate(-50%, 0)', opacity: '1' },
                '100%': { transform: 'translate(-200%, 0)', opacity: '0' },
              },
              slideDown: {
                '0%': { transform: 'translate(-50%, -100%)', opacity: '0' },
                '100%': { transform: 'translate(-50%, 0)', opacity: '1' },
              },
              slideFromCenter: {
                '0%': { transform: 'translate(var(--translate-x, 0), var(--translate-y, 0))', opacity: '0' },
                '100%': { transform: 'translate(0, 0)', opacity: '1' },
              },
            }
          },
        },
      }
    </script>
    <script>
      // Detect OS theme preference and set initial theme class
      (function() {
        // Mirrors App's theme state so the first paint is already in the right theme
        const stored = localStorage.getItem('mycouncil-theme');
        const theme = stored === 'light' || stored === 'dark' || stored === 'amoled'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme !== 'light') document.documentElement.classList.add(theme);
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
